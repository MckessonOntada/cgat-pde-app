name: CI/Release Workflow

on:
  push:
    branches:
      - '*'

env:
  DOCKER_REGISTRY: "mck-ontada-sre.jfrog.io" 
  IMAGE_NAME: "mck-ontada-sre.jfrog.io/cgat-pde-app" 
  PRISMA_USER:  ${{ secrets.PRISMA_USER }}
  PRISMA_PASSWORD:  ${{ secrets.PRISMA_PASSWORD }}

jobs:
  build_and_push:
    name: Build, Test, and Push Docker
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Generate short SHA
        uses: benjlevesque/short-sha@v1.2
        id: short-sha
        with:
          length: 7

      - name: Setup Docker build
        uses: docker/setup-buildx-action@v1

      - name: Login to JFrog
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DEV_PORTAL_JFROG_USERNAME }} 
          password: ${{ secrets.DEV_PORTAL_JFROG_API_KEY }} 
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker Build
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          context: .
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.short-sha.outputs.sha }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: NPM_TOKEN=${{ secrets.NPM_TOKEN }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline
          load: true

      - name: Download Wiz CLI
        run: curl -L -o wizcli https://downloads.wiz.io/wizcli/latest/wizcli-linux-amd64 && chmod +x wizcli
                                  
      - name: Authenticate to Wiz
        env:
          WIZ_CLIENT: ${{ secrets.WIZ_CLIENT }}
          WIZ_SECRET: ${{ secrets.WIZ_SECRET }}
        run: |
          ls
          ./wizcli auth --id ${{ env.WIZ_CLIENT }} --secret ${{ env.WIZ_SECRET }}

      - name: Run wiz-cli docker image scan
        id: scan-docker-image
        run: |
          WIZ_IMAGE_POLICY="McKesson Vulnerability Scanner Policy"
          ./wizcli docker scan --image ${{ env.IMAGE_NAME }} --policy "$WIZ_IMAGE_POLICY"

      - name: Generate wiz-cli Docker Image Scan report
        id: scan
        run: |
          ./wizcli docker scan --image ${{ env.IMAGE_NAME }} --policy "$WIZ_IMAGE_POLICY" >> scan_output.txt
          echo "printing the report"
          cat scan_output.txt

      - name: Analyze Scan Output
        id: analyze
        run: |
          CRITICAL_COUNT=$(grep -o 'CRITICAL' scan_output.txt | wc -l)
          echo "CRITICAL vulnerabilities found: $CRITICAL_COUNT"
          if [ $CRITICAL_COUNT -gt 5 ]; then
            echo "More than 5 CRITICAL vulnerabilities found. Failing the workflow."
            # exit 1
          fi

      - name: Upload wiz-cli Scan Output
        id: Upload-wiz-cli-scan-Output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wiz-cli-scan-results
          path: scan_output.txt
          
      - if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/R1.0' || startsWith(github.ref, 'refs/heads/release-')
        id: version-bump-git-tag
        name: Bump version and push git tag
        uses: anothrNick/github-tag-action@9885a4f9af674ba472de91fb3c0cb033ecb32b7e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/R1.0' || startsWith(github.ref, 'refs/heads/release-')
        name: Docker Push
        id: push-docker-image
        run: |
          docker tag $IMAGE_NAME:${{ steps.short-sha.outputs.sha }} $IMAGE_NAME:${{ steps.version-bump-git-tag.outputs.new_tag }}
          docker push -a $IMAGE_NAME

      - if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/R1.0' || startsWith(github.ref, 'refs/heads/release-')
        name: Create Prerelease
        uses: ncipollo/release-action@v1
        with:
          prerelease: true
          tag: ${{ steps.version-bump-git-tag.outputs.new_tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
