---
apiVersion: v1
kind: Secret
metadata:
  name: cgat-pde-app-prod-secrets
  namespace: ontada-cgat-pde-prod
type: Opaque
stringData:
  REACT_APP_USERMANAGEMENT_SERVICE_BASE_URL: "${REACT_APP_USERMANAGEMENT_SERVICE_BASE_URL}" 
  REACT_APP_ORDERMANAGEMENT_SERVICE_BASE_URL: "${REACT_APP_ORDERMANAGEMENT_SERVICE_BASE_URL}" 
  REACT_APP_PUBLIC_PATH: "${REACT_APP_PUBLIC_PATH}"
  REACT_APP_FS_ORG_ID: "${REACT_APP_FS_ORG_ID}"
  REACT_APP_OKTA_AUTH_SERVER_ID: "${REACT_APP_OKTA_AUTH_SERVER_ID}"
  REACT_APP_OKTA_CLIENT_ID: "${REACT_APP_OKTA_CLIENT_ID}"


---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cgat-pde-app-prod
  namespace: ontada-cgat-pde-prod 
  labels:
    backstage.io/kubernetes-id: cgat-pde-app-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cgat-pde-app-prod
  template:
    metadata:
      labels:
        app: cgat-pde-app-prod
        backstage.io/kubernetes-id: cgat-pde-app-prod
        appContact: 'piyush_ranjan'
        github: 'cgat-pde-app'
        appVersion: '${IMAGE_TAG}'
        workflow: '${WORKFLOW_ID}'
    spec:
      containers:
        - name: cgat-pde-app-prod
          image: "${DOCKER_REGISTRY}/cgat-pde-app:${IMAGE_TAG}"
          ports:
            - containerPort: 3000
          imagePullPolicy: Always
          resources:
            limits:
              cpu: 1
              memory: 2Gi
            requests:
              cpu: 50m
              memory: 200Mi
          envFrom:
              - secretRef:
                  name: cgat-pde-app-prod-secrets
      imagePullSecrets:
        - name: docker-registry-credentials # TODO: Create this Kubernetes Secret with your jFrog credentials (example in SECRETS.md)

---
apiVersion: v1
kind: Service
metadata:
  name: cgat-pde-app-prod-svc
  namespace: ontada-cgat-pde-prod
  labels:
    app: cgat-pde-app-prod
    backstage.io/kubernetes-id: cgat-pde-app-prod
spec:
  ports:
    - protocol: TCP
      port: 3000
  selector:
    app: cgat-pde-app-prod
  type: ClusterIP
