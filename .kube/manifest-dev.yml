---
apiVersion: v1
kind: Secret
metadata:
  name: cgat-pde-app-dev-secrets
  namespace: ontada-cgat-pde-dev
type: Opaque
stringData:
  REACT_APP_PUBLIC_PATH: "${REACT_APP_PUBLIC_PATH}"
  REACT_APP_ENVIRONMENT: "${REACT_APP_ENVIRONMENT}"
  REACT_APP_QUEUEMANAGEMENT_MFE: "${REACT_APP_QUEUEMANAGEMENT_MFE}"
  REACT_APP_USERMANAGEMENT_SERVICE_BASE_URL: "${REACT_APP_USERMANAGEMENT_SERVICE_BASE_URL}"
  REACT_APP_DATA_ABSTRACTION_SERVICE_BASE_URL: "${REACT_APP_DATA_ABSTRACTION_SERVICE_BASE_URL}"
  REACT_APP_STUDY_MANAGEMENT_SERVICE_BASE_URL: "${REACT_APP_STUDY_MANAGEMENT_SERVICE_BASE_URL}"
  FAST_REFRESH: "${FAST_REFRESH}"
  REACT_APP_INACTIVITY_TIMEOUT: "60"
  REACT_APP_STUDY_MANAGEMENT_SERVICE_BASE_URL: "${REACT_APP_STUDY_MANAGEMENT_SERVICE_BASE_URL}"
  REACT_APP_CONTENT_SERVICE_BASE_URL: "${REACT_APP_CONTENT_SERVICE_BASE_URL}"
  IPV_VIEWER_URL: "${IPV_VIEWER_URL}"
  SERVICE_NOW_URL: "${SERVICE_NOW_URL}"


---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cgat-pde-app-dev
  namespace: ontada-cgat-pde-dev 
  labels:
    backstage.io/kubernetes-id: cgat-pde-app-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cgat-pde-app-dev
  template:
    metadata:
      labels:
        app: cgat-pde-app-dev
        backstage.io/kubernetes-id: cgat-pde-app-dev
        appContact: 'piyush_ranjan'
        github: 'cgat-pde-app'
        appVersion: '${IMAGE_TAG}'
        workflow: '${WORKFLOW_ID}'
    spec:
      containers:
        - name: cgat-pde-app-dev
          image: "${DOCKER_REGISTRY}/cgat-pde-app:${IMAGE_TAG}"
          ports:
            - containerPort: 3000
          imagePullPolicy: Always
          resources:
            limits:
              cpu: 1
              memory: 2Gi
            requests:
              cpu: 50m
              memory: 200Mi
          envFrom:
              - secretRef:
                  name: cgat-pde-app-dev-secrets
      imagePullSecrets:
        - name: docker-registry-credentials # TODO: Create this Kubernetes Secret with your jFrog credentials (example in SECRETS.md)

---
apiVersion: v1
kind: Service
metadata:
  name: cgat-pde-app-dev-svc
  namespace: ontada-cgat-pde-dev
  labels:
    app: cgat-pde-app-dev
    backstage.io/kubernetes-id: cgat-pde-app-dev
spec:
  ports:
    - protocol: TCP
      port: 3000
  selector:
    app: cgat-pde-app-dev
  type: ClusterIP