---
apiVersion: v1
kind: Secret
metadata:
  name: cgat-pde-app-uat-secrets
  namespace: cgat-pde-uat
type: Opaque
stringData:
  REACT_APP_USERMANAGEMENT_SERVICE_BASE_URL: "${REACT_APP_USERMANAGEMENT_SERVICE_BASE_URL}"
  REACT_APP_ORDERMANAGEMENT_SERVICE_BASE_URL: "${REACT_APP_ORDERMANAGEMENT_SERVICE_BASE_URL}"
  REACT_APP_NOTIFICATION_SERVICE_BASE_URL: "${REACT_APP_NOTIFICATION_SERVICE_BASE_URL}"
  REACT_APP_PUBLIC_PATH: "${REACT_APP_PUBLIC_PATH}"
  REACT_APP_FS_ORG_ID: "${REACT_APP_FS_ORG_ID}"
  REACT_APP_OKTA_AUTH_SERVER_ID: "${REACT_APP_OKTA_AUTH_SERVER_ID}"
  REACT_APP_OKTA_CLIENT_ID: "${REACT_APP_OKTA_CLIENT_ID}"
  REACT_APP_OKTA_BASE_URL: "${REACT_APP_OKTA_BASE_URL}"
  REACT_APP_OKTA_LOGIN_URL: "${REACT_APP_OKTA_LOGIN_URL}"
  REACT_APP_RELEASE_BUILD_TAG: "${REACT_APP_RELEASE_BUILD_TAG}"
---
apiVersion: v1
stringData:
  .dockerconfigjson: |
    {
    "auths": {
      "${DOCKER_REGISTRY}": {
        "username": "${JFROG_USERNAME}",
        "password": "${JFROG_API_KEY}",
        "email": "devops@mckesson.com"
          }
        }
    }
kind: Secret
metadata:
  name: cgat-pde-app-jfrog-secret
  namespace: cgat-pde-uat
type: kubernetes.io/dockerconfigjson
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cgat-pde-app-uat
  namespace: cgat-pde-uat 
  labels:
    backstage.io/kubernetes-id: cgat-pde-app-uat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cgat-pde-app-uat
  template:
    metadata:
      labels:
        app: cgat-pde-app-uat
        backstage.io/kubernetes-id: cgat-pde-app-uat
        appContact: 'piyush_ranjan'
        github: 'cgat-pde-app'
        appVersion: '${IMAGE_TAG}'
        workflow: '${WORKFLOW_ID}'
    spec:
      containers:
        - name: cgat-pde-app-uat
          image: "${DOCKER_REGISTRY}/cgat-pde-app:${IMAGE_TAG}"
          ports:
            - containerPort: 3000
          imagePullPolicy: Always
          resources:
            limits:
              cpu: 1
              memory: 2Gi
            requests:
              cpu: 50m
              memory: 200Mi
          envFrom:
              - secretRef:
                  name: cgat-pde-app-uat-secrets
      imagePullSecrets:
        - name: cgat-pde-app-jfrog-secret # TODO: Create this Kubernetes Secret with your jFrog credentials (example in SECRETS.md)

---
apiVersion: v1
kind: Service
metadata:
  name: cgat-pde-app-uat-svc
  namespace: cgat-pde-uat
  labels:
    app: cgat-pde-app-uat
    backstage.io/kubernetes-id: cgat-pde-app-uat
spec:
  ports:
    - protocol: TCP
      port: 3000
  selector:
    app: cgat-pde-app-uat
  type: ClusterIP
